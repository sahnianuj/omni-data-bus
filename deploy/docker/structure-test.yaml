# container-structure-test config for the Omni-Data-Bus image (OC-032 AC1).
#   container-structure-test test --image omni-data-bus:ci --config deploy/docker/structure-test.yaml
schemaVersion: 2.0.0

metadataTest:
  labels:
    - key: org.opencontainers.image.licenses
      value: Apache-2.0
  user: "65532:65532"
  entrypoint: ["/usr/local/bin/odb"]
  exposedPorts: ["8080", "9090"]
  envVars:
    - key: OC_HTTP_ADDR
      value: ":8080"
    - key: OC_METRICS_ADDR
      value: ":9090"

fileExistenceTests:
  - name: binary
    path: /usr/local/bin/odb
    shouldExist: true
    isExecutableBy: any
  - name: CA certificates
    path: /etc/ssl/certs/ca-certificates.crt
    shouldExist: true
  - name: "OC-038: directory target folder owned by the server user"
    path: /data/odb-out
    shouldExist: true
    uid: 65532
    gid: 65532
  - name: no shell
    path: /bin/sh
    shouldExist: false
  - name: "OC-189: LICENSE"
    path: /usr/share/doc/omni-data-bus/LICENSE
    shouldExist: true
  - name: "OC-189: NOTICE"
    path: /usr/share/doc/omni-data-bus/NOTICE
    shouldExist: true
  - name: "OC-189: third-party notices"
    path: /usr/share/doc/omni-data-bus/THIRD_PARTY_NOTICES.md
    shouldExist: true
  - name: "OC-188: the folder for the release's odb checksums"
    path: /usr/local/share/odb
    shouldExist: true

commandTests:
  - name: "AC1: image reports version"
    command: /usr/local/bin/odb
    args: ["--version"]
    expectedOutput: ['^Omni-Data-Bus \S+ \((release|rc|dev)\)', 'Commit: \S+  Built: \S+  Go: go\S+  Platform: linux/\S+']
  - name: admin gen-key prints a 32-byte key
    command: /usr/local/bin/odb
    args: ["admin", "gen-key"]
    expectedOutput: ['^[A-Za-z0-9+/]{43}=\s*$']
