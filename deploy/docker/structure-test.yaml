# container-structure-test config for the Omni-Data-Bus image (OC-032 AC1).
#   container-structure-test test --image omni-data-bus:ci --config deploy/docker/structure-test.yaml
schemaVersion: 2.0.0

metadataTest:
  user: "65532:65532"
  entrypoint: ["/usr/local/bin/odb"]
  exposedPorts: ["8080", "9090"]
  envVars:
    - key: OC_HTTP_ADDR
      value: ":8080"
    - key: OC_METRICS_ADDR
      value: ":9090"

fileExistenceTests:
  - name: binary
    path: /usr/local/bin/odb
    shouldExist: true
    isExecutableBy: any
  - name: CA certificates
    path: /etc/ssl/certs/ca-certificates.crt
    shouldExist: true
  - name: no shell
    path: /bin/sh
    shouldExist: false

commandTests:
  - name: version
    command: /usr/local/bin/odb
    args: ["--version"]
    expectedOutput: ['^odb \S+ \(commit \S+\)']
  - name: admin gen-key prints a 32-byte key
    command: /usr/local/bin/odb
    args: ["admin", "gen-key"]
    expectedOutput: ['^[A-Za-z0-9+/]{43}=\s*$']
