# Local development stack for Omni-Data-Bus.
#
#   couchbase       Couchbase Server 8.0.3. Hosts two buckets:
#                     - omniconnect: Omni-Data-Bus's own metadata (stands in for the Capella bucket)
#                     - sandbox:     a migration target to play with
#   couchbase-init  One-shot job that initializes the cluster and creates the buckets (idempotent).
#   source-pg       Sample PostgreSQL *source* database (schema "shop") to migrate from.
#
# Start: make dev-stack   (or: docker compose -f deploy/compose/dev.yml up -d --wait)
name: omni-connect-dev

services:
  couchbase:
    image: couchbase/server:enterprise-8.0.3
    ports:
      - "8091-8097:8091-8097"
      - "9123:9123"
      - "11207:11207"
      - "11210:11210"
      - "11280:11280"
      - "18091-18097:18091-18097"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8091/ui/index.html"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  couchbase-init:
    image: couchbase/server:enterprise-8.0.3
    depends_on:
      couchbase:
        condition: service_healthy
    environment:
      CB_HOST: couchbase
      CB_USERNAME: Administrator
      CB_PASSWORD: password
      META_BUCKET: omniconnect
      TARGET_BUCKET: sandbox
    volumes:
      - ./couchbase/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

  source-pg:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: shop_owner
    volumes:
      - ./seed/source:/docker-entrypoint-initdb.d:ro
      - source-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_owner -d shop"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  couchbase-data:
  source-pg-data:
