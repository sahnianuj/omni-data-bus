# CI override for the compose smoke test (OC-032 AC3): runs prod.yml against the dev stack's
# Couchbase instead of Capella.
#   make dev-stack
#   docker compose -f deploy/compose/prod.yml -f deploy/compose/ci.yml --env-file deploy/compose/ci.env up -d --wait
services:
  omni-data-bus:
    networks: [devstack]
networks:
  devstack:
    name: omni-connect-dev_default
    external: true
