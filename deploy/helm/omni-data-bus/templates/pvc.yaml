{{- if and .Values.directoryTarget.enabled (not .Values.directoryTarget.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "odb.outputClaim" . }}
  labels:
    {{- include "odb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # exported files outlive an uninstall
spec:
  accessModes: [{{ .Values.directoryTarget.persistence.accessMode }}]
  {{- with .Values.directoryTarget.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.directoryTarget.persistence.size }}
{{- end }}
