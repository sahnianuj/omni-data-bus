name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.14.0, working-directory: backend }

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      # shellcheck (preinstalled) checks the 2.0 migrate.sh template here; the bats suites run in
      # runner-compat-2.0.
      - run: make test-backend 2>&1 | tee backend-test.log
        shell: bash
      # The failures, on the run page: the full log buries them among ~60 packages.
      - if: failure()
        run: |
          { echo '### Failed Go tests'; echo '```'
            grep -E -A20 -e '^(--- FAIL|panic:|FAIL)' -e 'build failed|DATA RACE|coverage gate' backend-test.log | head -300
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Apache-2.0 (OC-189): every shipped dependency is in THIRD_PARTY_NOTICES.md with an allowed
  # licence (scripts/licence-policy.json), and LICENSE, NOTICE and the notices are copied where
  # builds embed them.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd backend && go mod download
      - run: cd web && npm ci
      - run: make notices-check

  # No secret anywhere in the history before it goes public (OC-189 AC7). Reviewed test and
  # development values are listed, with the reason, in .gitleaksignore.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --source . --log-opts=--all --redact --no-banner

  # 2.0 exports keep working (OC-181 AC2, OC-184 AC2): their migrate.sh, with the bats suites
  # (OC-053), against this odb. Until 3.0, when the script and the suites are deleted.
  runner-compat-2_0:
    name: runner-compat-2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: make test-scripts

  # One export folder, the odb commands alone, on every OS (OC-182 AC1, OC-184 AC1, OC-186 AC1):
  # the runner's unit tests, then preflight, a run interrupted with the OS's interrupt (Ctrl+Break
  # on Windows), status, resume and verify, against a PostgreSQL loaded with the dev stack's
  # shop seed.
  runner-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE shop_owner LOGIN SUPERUSER PASSWORD 'shop_owner'"
          sudo -u postgres createdb -O shop_owner shop
      - name: PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          bin="$(brew --prefix postgresql@16)/bin"
          echo "$bin" >> "$GITHUB_PATH"
          brew services start postgresql@16
          for _ in $(seq 30); do "$bin/pg_isready" -h localhost && break; sleep 1; done
          "$bin/psql" -h localhost -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE shop_owner LOGIN SUPERUSER PASSWORD 'shop_owner'"
          "$bin/createdb" -h localhost -O shop_owner shop
      - name: PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { PGPASSWORD: root }
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          & "$env:PGBIN\psql" -U postgres -h localhost -v ON_ERROR_STOP=1 -c "CREATE ROLE shop_owner LOGIN SUPERUSER PASSWORD 'shop_owner'"
          & "$env:PGBIN\createdb" -U postgres -h localhost -O shop_owner shop
          "$env:PGBIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: The shop seed
        shell: bash
        env: { PGPASSWORD: shop_owner }
        run: |
          for f in deploy/compose/seed/source/*.sql; do
            psql -h localhost -U shop_owner -d shop -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Unit tests
        shell: bash
        working-directory: backend
        env: { CGO_ENABLED: "0" }
        run: go test -count=1 -skip 'TestScriptTemplate|TestMigrateScript_Bats' ./cmd/odb/ ./internal/headless/ ./internal/export/ ./internal/mapping/ ./internal/pathcodec/
      - name: End to end with odb alone
        shell: bash
        working-directory: backend
        env: { CGO_ENABLED: "0", OC_IT_PG_HOST: localhost, OC_IT_PG_PORT: "5432" }
        run: go test -tags integration -count=1 -run 'TestRunner_' -v ./cmd/odb/

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: make test-integration

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: govulncheck (fails on vulnerabilities reachable from our code)
        run: cd backend && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: npm audit (production dependencies, high severity fails)
        run: cd web && npm audit --omit=dev --audit-level=high

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: docker run --rm -v "$PWD/deploy/observability:/w" --entrypoint promtool prom/prometheus:v3.5.0 check rules /w/alerts.yml

  image-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: omni-data-bus:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Structure test and size (< 40 MB)
        run: make image-test IMAGE=omni-data-bus:ci VERSION=ci
      - name: Vulnerability scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omni-data-bus:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save image for the smoke test
        run: docker save omni-data-bus:ci -o /tmp/odb-image.tar
      - uses: actions/upload-artifact@v4
        with: { name: odb-image, path: /tmp/odb-image.tar, retention-days: 1 }

  compose-smoke:
    needs: image-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: odb-image, path: /tmp }
      - run: docker load -i /tmp/odb-image.tar
      - run: make dev-stack
      - name: Start the production stack against the dev Couchbase
        run: |
          mkdir -p deploy/compose/secrets-ci
          docker run --rm omni-data-bus:ci admin gen-key > deploy/compose/secrets-ci/master_key
          printf password > deploy/compose/secrets-ci/meta_password
          docker compose -f deploy/compose/prod.yml -f deploy/compose/ci.yml --env-file deploy/compose/ci.env up -d --wait
      - run: curl -fsS localhost:18080/readyz && curl -fsS localhost:19090/metrics | grep -q '^oc_'
      - if: failure()
        run: docker compose -f deploy/compose/prod.yml -f deploy/compose/ci.yml --env-file deploy/compose/ci.env logs

  e2e:
    needs: image-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: odb-image, path: /tmp }
      - run: docker load -i /tmp/odb-image.tar && docker tag omni-data-bus:ci omni-data-bus:e2e
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      # Only the @smoke set: the full suite (a11y, resilience, every flow) runs locally with `make e2e`.
      - name: Playwright smoke (Chromium) against the built image
        run: E2E_SKIP_BUILD=1 ./scripts/e2e.sh --grep @smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  bench-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache: false }
      - run: make test-bench

  # Release gates (OC-056 AC4): the committed reference-environment results under
  # bench/results/2.0.0 against bench/gates-2.0.0.json. Local (indicative) runs don't count;
  # gates without a reference result yet are reported as pending here and block the release.
  bench-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache: false }
      - run: make bench-gate BENCH_GATE_ARGS="--allow-missing --summary $GITHUB_STEP_SUMMARY"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make helm-test

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: cd web && npm run lint && npm run typecheck
      - run: cd web && npm run test:coverage
      - run: cd web && npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: make check-gen
