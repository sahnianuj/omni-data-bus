name: Release
# On a v* tag: test, build and push a signed multi-arch image with an SBOM, scan it, push the Helm
# chart, build the all-in-one image (app + Couchbase CE, OC-073), build the odb runner binaries
# (the macOS one universal, signed and notarized, OC-185) with a signed SHA256SUMS (OC-051), and publish a GitHub release with the chart, the all-in-one archives
# and the binaries. On a PR labelled release-check: the same steps as a dry
# run (nothing is pushed, signed or published).
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read

env:
  IMAGE_NAME: omni-data-bus

jobs:
  meta:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-check')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      build_time: ${{ steps.v.outputs.build_time }}
      build: ${{ steps.v.outputs.build }}
      registry: ${{ steps.v.outputs.registry }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # The release is the VERSION file (OC-172); a tag must say the same release.
          release="$(cat VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"; echo "publish=true" >> "$GITHUB_OUTPUT"
            base="${version%%-*}"
            if [ "$base" != "$release" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION $release"; exit 1
            fi
          else
            version="$release-pr${{ github.event.pull_request.number }}"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}+$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          # Build info (OC-058): channel from the tag; build time = SOURCE_DATE_EPOCH (the commit
          # time), so rebuilding the same tag is reproducible.
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then channel=release
          elif [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha) ]]; then channel=rc
          else channel=dev; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "build_time=$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  test:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: make test-backend test-scripts test-web helm-test
      # A release with a gate file (bench/gates-<version>.json) ships only when every gate passed
      # in the reference environment (OC-056 AC4).
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/go.mod, cache: false }
      - name: Release gates
        env: { VERSION: "${{ needs.meta.outputs.version }}" }
        run: |
          if [ -f "bench/gates-$VERSION.json" ]; then
            make bench-gate RELEASE="$VERSION" BENCH_GATE_ARGS="--summary $GITHUB_STEP_SUMMARY"
          else
            echo "no bench/gates-$VERSION.json: no performance gates for this release"
          fi

  # The odb runner for exported migrations (OC-051): static binaries for linux and darwin,
  # unsigned here. odb-macos turns the darwin pair into one signed, notarized binary (OC-185) and
  # odb-sums writes and signs SHA256SUMS; export READMEs link the archives (OC-182).
  binaries:
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Build (linux, darwin × amd64, arm64)
        run: >-
          make dist VERSION=${{ needs.meta.outputs.version }} COMMIT=${{ github.sha }}
          BUILD_TIME=${{ needs.meta.outputs.build_time }} CHANNEL=${{ needs.meta.outputs.channel }}
          BUILD=${{ needs.meta.outputs.build }} DIRTY=false
      - name: Smoke test (linux/amd64)
        run: |
          tar -xzf "dist/odb/odb_${{ needs.meta.outputs.version }}_linux_amd64.tar.gz" -C /tmp odb
          /tmp/odb version --json | grep -q '"version": "${{ needs.meta.outputs.version }}"'
      - uses: actions/upload-artifact@v4
        with:
          name: odb-unsigned
          path: |
            dist/odb/*.tar.gz
            dist/odb/*.zip
          compression-level: 0

  # One macOS odb for Intel and Apple silicon (lipo), signed with the Developer ID and notarized,
  # so a downloaded odb opens with no Gatekeeper prompt on any Mac (OC-185). The signing secrets
  # are in the release environment: PR dry runs build and check the universal binary, unsigned.
  odb-macos:
    needs: [meta, binaries]
    runs-on: macos-14
    environment: ${{ needs.meta.outputs.publish == 'true' && 'release' || 'release-check' }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: odb-unsigned, path: unsigned }
      - name: Universal binary
        run: |
          for a in amd64 arm64; do mkdir -p "$a" && tar -xzf "unsigned/odb_${VERSION}_darwin_$a.tar.gz" -C "$a"; done
          mkdir -p universal
          lipo -create -output universal/odb amd64/odb arm64/odb
          cp amd64/LICENSE amd64/NOTICE amd64/THIRD_PARTY_NOTICES.md universal/ # OC-189
          test "$(lipo -archs universal/odb)" = "x86_64 arm64"
          for a in x86_64 arm64; do arch -$a universal/odb version --json | grep -q "\"version\": \"$VERSION\""; done
      - name: Import the Developer ID certificate
        if: env.PUBLISH == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/odb.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$P12" | base64 --decode >"$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word, kept after ours
          security list-keychains -d user -s "$kc" $existing
          rm -f "$RUNNER_TEMP/id.p12"
      - name: Sign and notarize
        if: env.PUBLISH == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }} # "Developer ID Application: … (TEAMID)"
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          codesign --force --sign "$IDENTITY" --options runtime --timestamp universal/odb
          codesign --verify --strict --verbose=2 universal/odb
          printf '%s' "$NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
          ditto -c -k universal/odb "$RUNNER_TEMP/odb.zip" # notarytool takes a zip, pkg or dmg
          xcrun notarytool submit "$RUNNER_TEMP/odb.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Gatekeeper accepts it
        if: env.PUBLISH == 'true'
        # A bare command-line binary can't carry a stapled ticket: Gatekeeper checks the
        # notarization online, as it will on the customer's Mac. A CLI tool is assessed as a file
        # to open with its primary signature ("--type execute" only accepts app bundles).
        run: spctl --assess --type open --context context:primary-signature -vv universal/odb 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
      - name: Archive
        run: |
          mkdir -p out
          tar -C universal --uid 0 --gid 0 -cf - odb LICENSE NOTICE THIRD_PARTY_NOTICES.md | gzip -n -9 >"out/odb_${VERSION}_darwin_universal.tar.gz"
          if [ "$PUBLISH" = true ]; then echo "odb_${VERSION}_darwin_universal.tar.gz" >out/SIGNED.darwin; fi
      - uses: actions/upload-artifact@v4
        with: { name: odb-macos, path: out/, compression-level: 0 }

  # odb.exe signed with Authenticode, so a downloaded odb runs without the SmartScreen warning
  # (OC-186). The certificate is in the release environment: PR dry runs repackage unsigned.
  # Code-signing keys issued since June 2023 live on an HSM: with a cloud HSM (Azure Trusted
  # Signing, DigiCert KeyLocker, …) replace the "Sign" step with the provider's signtool setup.
  odb-windows:
    needs: [meta, binaries]
    runs-on: windows-2022
    environment: ${{ needs.meta.outputs.publish == 'true' && 'release' || 'release-check' }}
    defaults: { run: { shell: pwsh } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: odb-unsigned, path: unsigned }
      - name: Unpack and smoke test (amd64)
        run: |
          foreach ($a in 'amd64', 'arm64') { Expand-Archive "unsigned/odb_${env:VERSION}_windows_$a.zip" -DestinationPath $a }
          $v = ./amd64/odb.exe version --json | ConvertFrom-Json
          if ($v.version -ne $env:VERSION) { throw "odb.exe reports $($v.version), not $env:VERSION" }
      - name: Sign
        if: env.PUBLISH == 'true'
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'odb.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          try {
            foreach ($a in 'amd64', 'arm64') {
              & $signtool sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr $env:TIMESTAMP_URL /td sha256 /d 'Omni-Data-Bus odb' "$a\odb.exe"
              if ($LASTEXITCODE) { throw "signing $a failed" }
              & $signtool verify /pa /v "$a\odb.exe"
              if ($LASTEXITCODE) { throw "$a\odb.exe doesn't verify" }
            }
          } finally { Remove-Item $pfx -ErrorAction SilentlyContinue }
      - name: Archive
        run: |
          New-Item -ItemType Directory out | Out-Null
          foreach ($a in 'amd64', 'arm64') {
            $zip = "odb_${env:VERSION}_windows_$a.zip"
            Compress-Archive -Path "$a\*" -DestinationPath "out\$zip" # odb.exe with LICENSE, NOTICE, THIRD_PARTY_NOTICES.md (OC-189)
            if ($env:PUBLISH -eq 'true') { Add-Content out\SIGNED.windows $zip }
          }
      - uses: actions/upload-artifact@v4
        with: { name: odb-windows, path: out/, compression-level: 0 }

  # SHA256SUMS over every archive, signed with cosign (keyless), and SIGNED: the archives signed
  # for their OS, which the server reads to warn about unsigned development builds (OC-185, OC-186).
  odb-sums:
    needs: [meta, binaries, odb-macos, odb-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      # The signed archives first; the unsigned build fills in the rest (linux, per-arch darwin)
      # without replacing a signed one of the same name.
      - uses: actions/download-artifact@v4
        with: { name: odb-macos, path: dist/odb }
      - uses: actions/download-artifact@v4
        with: { name: odb-windows, path: dist/odb }
      - uses: actions/download-artifact@v4
        with: { name: odb-unsigned, path: unsigned }
      - name: SHA256SUMS and SIGNED
        working-directory: dist/odb
        run: |
          cp -n ../../unsigned/* .
          shopt -s nullglob
          sha256sum odb_*.tar.gz odb_*.zip >SHA256SUMS
          cat SIGNED.* 2>/dev/null | sort >SIGNED || true
          rm -f SIGNED.*
          cat SHA256SUMS SIGNED
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS
        if: needs.meta.outputs.publish == 'true'
        run: cosign sign-blob --yes --bundle dist/odb/SHA256SUMS.sigstore.json dist/odb/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: odb-binaries, path: dist/odb/, compression-level: 0 }

  image:
    needs: [meta, test, odb-sums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    env:
      REF: ${{ needs.meta.outputs.registry }}/omni-data-bus:${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The release's checksums, built into the image: the server verifies each machine's odb it
      # downloads for an export against them (OC-188).
      - uses: actions/download-artifact@v4
        with: { name: odb-binaries, path: odb-binaries }
      - run: cp odb-binaries/SHA256SUMS odb-binaries/SIGNED deploy/docker/odb-sums/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (linux/amd64, linux/arm64) and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ env.REF }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.meta.outputs.build_time }}
            CHANNEL=${{ needs.meta.outputs.channel }}
            BUILD=${{ needs.meta.outputs.build }}
            DIRTY=false
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build a local amd64 copy to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: odb-scan:local
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.meta.outputs.build_time }}
            CHANNEL=${{ needs.meta.outputs.channel }}
            BUILD=${{ needs.meta.outputs.build }}
            DIRTY=false
          cache-from: type=gha
      - name: Vulnerability scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: odb-scan:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX, syft)
        uses: anchore/sbom-action@v0
        with:
          image: odb-scan:local
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image and attach the SBOM
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ needs.meta.outputs.registry }}/omni-data-bus
        run: |
          cosign sign --yes "$REPO@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REPO@$DIGEST"

  # The all-in-one image (OC-073 AC4): pushed multi-arch on top of the regular image the image job
  # pushed and signed (so that one isn't rebuilt), plus one docker-save archive per CPU for the
  # release page.
  appliance:
    needs: [meta, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ODB_REF: ${{ needs.meta.outputs.registry }}/omni-data-bus:${{ needs.meta.outputs.version }}
      REF: ${{ needs.meta.outputs.registry }}/omni-data-bus-appliance:${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # The archives: scripts/appliance.sh builds each CPU with the default (docker) builder, which
      # sees the regular image it just loaded.
      - name: Build and package (linux/amd64, linux/arm64)
        env:
          COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ needs.meta.outputs.build_time }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          BUILD: ${{ needs.meta.outputs.build }}
          DIRTY: "false"
        run: scripts/appliance.sh save all
      - name: Structure test and smoke test (amd64)
        run: |
          docker tag "omni-data-bus-appliance:$VERSION-amd64" "omni-data-bus-appliance:$VERSION"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/deploy/appliance:/cfg" \
            gcr.io/gcp-runtimes/container-structure-test:latest test --image "omni-data-bus-appliance:$VERSION" --config /cfg/structure-test.yaml
          IMAGE="omni-data-bus-appliance:$VERSION" deploy/appliance/test/smoke.sh
      # Most findings are in Couchbase's own image, which we ship unmodified: reported for review,
      # not a release gate (the regular image's scan is).
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omni-data-bus-appliance:${{ needs.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: docker/setup-buildx-action@v3
      - name: Push (linux/amd64, linux/arm64)
        id: push
        if: needs.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/appliance/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REF }}
          build-args: |
            ODB_IMAGE=${{ env.ODB_REF }}
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.meta.outputs.build_time }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: SBOM (SPDX, syft)
        uses: anchore/sbom-action@v0
        with:
          image: omni-data-bus-appliance:${{ needs.meta.outputs.version }}
          format: spdx-json
          output-file: appliance-sbom.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image and attach the SBOM
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ needs.meta.outputs.registry }}/omni-data-bus-appliance
        run: |
          cosign sign --yes "$REPO@$DIGEST"
          cosign attest --yes --type spdxjson --predicate appliance-sbom.spdx.json "$REPO@$DIGEST"
      - uses: actions/upload-artifact@v4
        with: { name: appliance, path: dist/appliance/, compression-level: 0 }

  chart:
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.18.4 }
      - name: Package
        run: |
          helm package deploy/helm/omni-data-bus \
            --version "${{ needs.meta.outputs.version }}" --app-version "${{ needs.meta.outputs.version }}" -d dist
      - name: Push (OCI)
        if: needs.meta.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/omni-data-bus-*.tgz "oci://${{ needs.meta.outputs.registry }}/charts"
      - uses: actions/upload-artifact@v4
        with: { name: helm-chart, path: dist/ }

  release:
    needs: [meta, image, chart, appliance, odb-sums]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changelog from Conventional Commits
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - uses: actions/download-artifact@v4
        with: { name: helm-chart, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: appliance, path: dist/appliance }
      - uses: actions/download-artifact@v4
        with: { name: odb-binaries, path: dist/odb }
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/appliance/* dist/odb/* \
            --title "Omni-Data-Bus ${{ needs.meta.outputs.version }}" --notes-file CHANGELOG.md
