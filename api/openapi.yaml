openapi: 3.1.0
info:
  title: Omni-Data-Bus API
  version: 1.0.0
  description: >
    REST API for Omni-Data-Bus. Errors use RFC 9457 problem+json. Mutating requests require the
    X-CSRF-Token header (see /api/v1/auth/me).
servers:
  - url: /
tags:
  - name: system
  - name: auth
  - name: projects
  - name: connections
  - name: discovery
  - name: keyspaces
  - name: mappings
  - name: relations
paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness
      responses:
        '200':
          description: The process is serving
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /metrics:
    get:
      tags: [system]
      operationId: metrics
      summary: Prometheus metrics (404 here when OC_METRICS_ADDR serves them on a separate listener)
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Metrics are served on OC_METRICS_ADDR instead
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness (metadata store reachable)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Release and build information
      description: >-
        Signed-in callers get the full build, the metadata schema version and the versions of the
        running nodes. Anonymous callers get only version and channel, or an empty object when
        OC_EXPOSE_BUILD_INFO=false. Cached for 10 s per API node (OC-058).
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create an account, a personal workspace and a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Signed up and signed in (sets the oc_session cookie)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in (sets the oc_session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (revokes the session)
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: The signed-in user, workspace, role and CSRF token
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Re-confirm the password before a sensitive action (exporting credentials); valid for 5 minutes in this session
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password } }
      responses:
        '204': { description: Confirmed }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/dashboard:
    get:
      tags: [projects]
      operationId: getDashboard
      summary: Workspace aggregates and recent projects
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of projects, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create an empty project (editor or owner)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: getProject
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Rename or re-describe; send the version you read (412 if it changed)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete the project with its repositories and stored credentials
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/connections:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [projects]
      operationId: getProjectConnections
      summary: The project's source and target repositories (never includes secrets)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Repositories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConnections' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connectors:
    get:
      tags: [connections]
      operationId: listConnectors
      summary: Supported source and target database types
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Connector catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorCatalog' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/test:
    post:
      tags: [connections]
      operationId: testConnection
      summary: Test unsaved connection settings (nothing is stored)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestConnectionRequest' }
      responses:
        '200':
          description: Step-by-step result (check `ok`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [connections]
      operationId: getConnection
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: The repository (never includes secrets)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [connections]
      operationId: testStoredConnection
      summary: Re-test a saved repository with its stored credentials and record the result
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Step-by-step result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/connections/{role}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: role, in: path, required: true, schema: { type: string, enum: [source, target] } }
    put:
      tags: [connections]
      operationId: saveProjectConnection
      summary: Create or replace the project's source/target (omitted secrets keep the stored ones)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveConnectionRequest' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [connections]
      operationId: deleteProjectConnection
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted with its stored credentials }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/connections/target/bundled:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [connections]
      operationId: saveBundledTarget
      summary: Make the all-in-one image's bundled Couchbase node the project's target, and test it (OC-072)
      description: >-
        Only on a server started with OC_BUNDLED_TARGET (the all-in-one image); 404 elsewhere. The
        password comes from the server's settings and is stored sealed like any other credential.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundledTargetSaved' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundledTargetSaved' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/discover:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [discovery]
      operationId: discoverSchema
      summary: Discover the source repository's schema (sync up to 2,000 relations, otherwise 202 and poll)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverRequest' }
      responses:
        '200':
          description: Discovery finished; the snapshot is stored as the latest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryStatus' }
        '202':
          description: Discovery is running (large catalog, or joined an in-flight run); poll discoveries/{did}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryStatus' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/discoveries/{did}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: did, in: path, required: true, schema: { type: string } }
    get:
      tags: [discovery]
      operationId: getDiscovery
      summary: Poll a discovery run
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryStatus' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/relations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [relations]
      operationId: getRelationGraph
      summary: Relationship paths from a root table (foreign keys both ways and virtual relationships), junction candidates and index advice (OC-042)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: root, in: query, required: true, schema: { type: string }, description: 'schema.table, e.g. public.orders' }
        - { name: depth, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 6, default: 4 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationGraph' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/relationships:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [relations]
      operationId: listRelationships
      summary: The project's virtual relationships (user-defined joins where the source has no foreign key)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Relationship' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [relations]
      operationId: createRelationship
      summary: Create a virtual relationship (column types must be compatible, else 422 RELATION_TYPE_MISMATCH)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relationship' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/relationships/detect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [relations]
      operationId: detectRelationshipCardinality
      summary: Sample the source to suggest a virtual relationship's cardinality (10 s timeout; "unknown" when it times out)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationshipDetection' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/relationships/{rid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: rid, in: path, required: true, schema: { type: string } }
    get:
      tags: [relations]
      operationId: getRelationship
      summary: One virtual relationship
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relationship' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [relations]
      operationId: updateRelationship
      summary: Replace a virtual relationship's definition
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: If-Match, in: header, required: false, schema: { type: string }, description: 'The relationship version, e.g. "2"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Relationship' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [relations]
      operationId: deleteRelationship
      summary: Delete a virtual relationship
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/schema:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [discovery]
      operationId: getSchema
      summary: The latest discovered schema (ETag = snapshot; summary=true omits columns, keys and indexes)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: summary, in: query, required: false, schema: { type: boolean } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Latest snapshot
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaResponse' }
        '304': { description: Unchanged since the given ETag }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/schema/{schema}/{table}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: schema, in: path, required: true, schema: { type: string } }
      - { name: table, in: path, required: true, schema: { type: string } }
    get:
      tags: [discovery]
      operationId: getSchemaTable
      summary: One table from the latest snapshot, with columns, keys, relationships and indexes
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Table detail
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceTable' }
        '304': { description: Unchanged since the given ETag }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/tables/{schema}/{table}/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: schema, in: path, required: true, schema: { type: string } }
      - { name: table, in: path, required: true, schema: { type: string } }
    get:
      tags: [discovery]
      operationId: previewTable
      summary: First rows of a table, encoded like a migration encodes them (not cached)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, default: 50 }, description: 'Capped at 200' }
        - { name: orderBy, in: query, required: false, schema: { type: string }, description: 'A column name; defaults to the primary key' }
      responses:
        '200':
          description: Preview rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResult' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/target-kinds:
    get:
      tags: [connections]
      operationId: listTargetKinds
      summary: Target kinds (Couchbase, directory) with their capabilities (OC-036)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Target kinds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetKindList' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/target-kinds/directory/folders:
    get:
      tags: [connections]
      operationId: listDirectoryFolders
      summary: Folder picker for a directory target (OC-038)
      description: >-
        Without path, the areas a directory target may be in (the home folder of the account running
        the server, and /data when it exists); with path, its visible sub-folders. Hidden folders are
        never listed or allowed. Editors only.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: path, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Folders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListing' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [connections]
      operationId: createDirectoryFolder
      summary: Create a folder from the folder picker
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent, name]
              properties:
                parent: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, required: [path], properties: { path: { type: string } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/projects/{id}/mappings/{mid}/documents/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: mid, in: path, required: true, schema: { type: string } }
      - { name: key, in: path, required: true, schema: { type: string }, description: 'The document key; may contain "/" and "::" (the rest of the path)' }
    get:
      tags: [mappings]
      operationId: getDocument
      summary: A migrated document by key (Couchbase KV get, or the file at its computed path)
      description: >-
        OC-039/OC-041. With download=1 the document is returned as a JSON attachment. A key whose file
        would be outside the mapping's folder reads as 404 and is audited (output.path_rejected).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: download, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredDocument' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/output:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: listJobOutput
      summary: A page of the documents a job's mapping wrote, sorted by key (directory targets)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: mapping, in: query, required: false, schema: { type: string }, description: Defaults to the job's first mapping }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Output page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputPage' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/locations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [keyspaces]
      operationId: listLocations
      summary: Children of a location on the target (buckets → scopes → collections, or sub-folders)
      description: Replaces the /buckets… endpoints for new clients; they stay as aliases for Couchbase targets until 3.0 (OC-036).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: parent, in: query, required: false, schema: { type: string }, description: 'Parent location path: "" (root), "bucket", "bucket/scope", or a folder such as "orders/2026"' }
      responses:
        '200':
          description: Child locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [keyspaces]
      operationId: createLocation
      summary: Create a location (a Couchbase scope and collection, or a folder)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Location' }
      responses:
        '201':
          description: Created and ready to use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationCreated' }
        '202':
          description: Created; the target is still making it available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/connections/{id}/buckets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [keyspaces]
      operationId: listBuckets
