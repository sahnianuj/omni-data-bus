      type: string
      enum: [PARSE_FAILED, TYPE_MISMATCH, EXPR_ERROR, NON_FINITE_NUMBER, TRANSFORM_INVALID, KEY_TEMPLATE_INVALID, KEY_NULL_COMPONENT, KEY_TOO_LONG, KEY_INVALID, DOC_TOO_LARGE, TEMPORARY_FAILURE_EXHAUSTED, WRITE_FAILED, DECODE_FAILED, KEY_PATH_COLLISION]
