                mode: { type: string, enum: [original, restart] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/cancel:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel (at once when queued or paused, else via the worker)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/retry:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    post:
      tags: [jobs]
      operationId: retryJob
      summary: New job that re-reads only the failed rows, with the current mapping (422 RETRY_NOT_POSSIBLE)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                onlyCodes: { type: array, items: { type: string } }
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateJobResult' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/events/log:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: getJobLog
      summary: The job's timeline
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/JobEvent' } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/errors:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: listJobErrors
      summary: Page through the job's stored row errors
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: stage, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: mappingId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobErrorList' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/errors/summary:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: summarizeJobErrors
      summary: Stored errors grouped by stage and code, with an example each
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/JobErrorCount' } }
                  truncated: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/errors/export:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: exportJobErrors
      summary: Download every stored error (CSV or NDJSON)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, ndjson] } }
      responses:
        '200':
          description: The file
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/jobs/{jid}/events:
    parameters:
      - { name: jid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: 'Server-Sent Events: the current snapshot, then progress, status, error-sample and completed events (heartbeat comment every 15 s)'
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 'An event stream: "id: <seq>\nevent: progress|status|error-sample|completed\ndata: <ProgressSnapshot JSON>"'
          content:
            text/event-stream: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/events:
    get:
      tags: [jobs]
      operationId: streamManyJobEvents
      summary: One Server-Sent Events stream for up to 20 jobs (the Dashboard and Jobs list)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: jobs, in: query, required: true, schema: { type: string }, description: Comma-separated job IDs (max 20) }
      responses:
        '200':
          description: An event stream; each event's data carries its jobId
          content:
            text/event-stream: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: oc_session
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    KeyspaceCreated:
      description: Created and ready to use
      content:
        application/json:
          schema: { $ref: '#/components/schemas/KeyspaceCreateResult' }
    KeyspacePending:
      description: Created; the cluster is still making it available
      content:
        application/json:
          schema: { $ref: '#/components/schemas/KeyspaceCreateResult' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
    Version:
      type: object
      description: Every field is optional because anonymous callers get a subset (OC-058).
      properties:
        version: { type: string, example: 2.0.0 }
        channel: { type: string, enum: [release, rc, dev] }
        commit: { type: string, example: 3f2a9c1 }
        buildTime: { type: string, description: 'UTC RFC 3339; empty for local builds', example: '2026-11-02T14:05:11Z' }
        goVersion: { type: string, example: go1.26.8 }
        platform: { type: string, example: linux/amd64 }
        dirty: { type: boolean, description: Built from uncommitted changes }
        metadataSchemaVersion: { type: integer }
        nodes:
          type: object
          description: Distinct versions of the live nodes, by role
          properties:
            api: { type: array, items: { type: string } }
            worker: { type: array, items: { type: string } }
        consistent: { type: boolean, description: false when nodes run more than one version }
        bundledStore: { type: string, description: 'The all-in-one image''s bundled Couchbase (OC-072)', example: Couchbase Server CE 8.0.2 }
    SignupRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 256 }
        displayName: { type: string, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    SessionResponse:
      type: object
      required: [user, workspace, role, csrfToken]
      properties:
        user:
          type: object
          required: [id, email, displayName]
          properties:
            id: { type: string }
            email: { type: string }
            displayName: { type: string }
        workspace:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        csrfToken: { type: string }
    RepoSummary:
      type: object
      required: [id, type, name, lastTestStatus]
      properties:
        id: { type: string }
        type: { type: string, enum: [postgres, couchbase, directory] }
        name: { type: string }
        lastTestStatus: { type: string, enum: [ok, warn, failed, untested] }
        lastTestedAt: { type: string, format: date-time }
    Project:
      type: object
      required: [id, name, description, status, version, createdAt, updatedAt, source, target]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, configured, ready, running, completed, failed] }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        source: { oneOf: [{ $ref: '#/components/schemas/RepoSummary' }, { type: 'null' }] }
        target: { oneOf: [{ $ref: '#/components/schemas/RepoSummary' }, { type: 'null' }] }
        mappings: { type: integer }
        readyMappings: { type: integer }
        latestJob:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id: { type: string }
                status: { $ref: '#/components/schemas/JobStatus' }
            - { type: 'null' }
    ProjectList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        nextCursor: { type: string }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    UpdateProjectRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        version: { type: integer, format: int64 }
    SecretMeta:
      type: object
      required: [passwordSet, caCertSet, clientCertSet]
      properties:
        passwordSet: { type: boolean }
        caCertSet: { type: boolean }
        caCertFingerprint: { type: string }
        clientCertSet: { type: boolean }
    Connection:
      type: object
      required: [id, projectId, role, type, name, config, lastTestStatus, createdAt, updatedAt, version]
      properties:
        id: { type: string }
        projectId: { type: string }
        role: { type: string, enum: [source, target] }
        type: { type: string, enum: [postgres, couchbase, directory] }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        secrets: { $ref: '#/components/schemas/SecretMeta' }
        lastTestStatus: { type: string, enum: [ok, warn, failed, untested] }
        lastTestedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ProjectConnections:
      type: object
      required: [source, target]
      properties:
        source: { oneOf: [{ $ref: '#/components/schemas/Connection' }, { type: 'null' }] }
        target: { oneOf: [{ $ref: '#/components/schemas/Connection' }, { type: 'null' }] }
    Dashboard:
      type: object
      required: [stats, recent]
      properties:
        stats:
          type: object
          required: [projects, runningJobs, docsMigrated30d, repositoriesHealthy, repositoriesTotal, configuredProjects]
          properties:
            projects: { type: integer }
            runningJobs: { type: integer }
            docsMigrated30d: { type: integer }
            repositoriesHealthy: { type: integer }
            repositoriesTotal: { type: integer }
            configuredProjects: { type: integer }
        recent: { type: array, items: { $ref: '#/components/schemas/Project' } }
    ConnectorDescriptor:
      type: object
      required: [type, role, displayName, icon, capabilities]
      properties:
        type: { type: string }
        role: { type: string, enum: [source, target] }
        displayName: { type: string }
        icon: { type: string }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    ConnectorCatalog:
      type: object
      required: [sources, targets]
      properties:
        sources: { type: array, items: { $ref: '#/components/schemas/ConnectorDescriptor' } }
        targets: { type: array, items: { $ref: '#/components/schemas/ConnectorDescriptor' } }
    SecretsPatch:
      type: object
      description: Write-only. Omit a field to keep the stored value.
      properties:
        password: { type: string, minLength: 1 }
        caCertPem: { type: string }
        clearCaCert: { type: boolean }
        clientCertPem: { type: string }
        clientKeyPem: { type: string }
        clearClientCert: { type: boolean }
    TestConnectionRequest:
      type: object
      required: [role, type, config]
      properties:
        role: { type: string, enum: [source, target] }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secrets: { $ref: '#/components/schemas/SecretsPatch' }
    SaveConnectionRequest:
      type: object
      required: [type, config]
      properties:
        type: { type: string }
        name: { type: string, maxLength: 100 }
        config: { type: object, additionalProperties: true }
        secrets: { $ref: '#/components/schemas/SecretsPatch' }
        relocate:
          type: object
          description: 'Target kind change (OC-068): move every mapping to the new kind, keeping its collection or folder name. Couchbase needs bucket and scope. Without it, a kind change while mappings have locations is 409 TARGET_KIND_IN_USE.'
          properties:
            bucket: { type: string }
            scope: { type: string }
    TestStep:
      type: object
      required: [id, label, status]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, warn, fail, skipped] }
        ms: { type: integer }
        detail: { type: string }
        hint: { type: string }
        code: { type: string }
    TestResult:
      type: object
      required: [ok, latencyMs, steps]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/TestStep' } }
        capabilities: { type: object, additionalProperties: true }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        instance: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    DiscoverRequest:
      type: object
      properties:
        schemas: { type: array, items: { type: string }, description: 'Include list; empty = every non-system schema' }
        exclude: { type: array, items: { type: string }, description: 'Globs matched against "table" and "schema.table"' }
    DiscoveryStatus:
      type: object
      required: [discoveryId, connectionId, status, startedAt]
      properties:
        discoveryId: { type: string }
        connectionId: { type: string }
        status: { type: string, enum: [running, completed, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        snapshotId: { type: string }
        tableCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        diff: { $ref: '#/components/schemas/SchemaDiff' }
        error: { $ref: '#/components/schemas/Problem' }
    SchemaDiff:
      type: object
      required: [addedTables, removedTables, changedTables]
      properties:
        addedTables: { type: array, items: { type: string } }
        removedTables: { type: array, items: { type: string } }
        changedTables:
          type: array
          items:
            type: object
            required: [table, addedColumns, removedColumns, typeChanged]
            properties:
              table: { type: string }
              addedColumns: { type: array, items: { type: string } }
              removedColumns: { type: array, items: { type: string } }
              typeChanged:
                type: array
                items:
                  type: object
                  required: [column, from, to]
                  properties:
                    column: { type: string }
                    from: { type: string }
                    to: { type: string }
    SchemaResponse:
      type: object
      required: [snapshotId, capturedAt, durationMs, tableCount, database, serverVersion, schemas]
      properties:
        snapshotId: { type: string }
        capturedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        tableCount: { type: integer }
        database: { type: string }
        serverVersion: { type: string }
        schemas:
          type: array
          items:
            type: object
            required: [name, tables]
            properties:
              name: { type: string }
              tables:
                type: array
                description: TableSummary items when summary=true, otherwise SourceTable items
                items:
                  oneOf:
                    - { $ref: '#/components/schemas/TableSummary' }
                    - { $ref: '#/components/schemas/SourceTable' }
    TableKind:
      type: string
      enum: [table, partitioned_table, view, materialized_view, foreign_table]
    TableSummary:
      type: object
      required: [name, kind, rowEstimate, sizeBytes, columnCount, hasPrimaryKey, readable]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/TableKind' }
        rowEstimate: { type: [integer, 'null'], format: int64 }
        rowCountExact: { type: boolean, description: rowEstimate is an exact count(*), not a planner estimate }
        statsStale: { type: boolean }
        sizeBytes: { type: integer, format: int64 }
        columnCount: { type: integer }
        hasPrimaryKey: { type: boolean }
        readable: { type: boolean }
    SourceTable:
      type: object
      required: [name, kind, rowEstimate, sizeBytes, readable, columns, primaryKey, uniqueConstraints, foreignKeys, referencedBy, indexes]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/TableKind' }
        rowEstimate: { type: [integer, 'null'], format: int64 }
        rowCountExact: { type: boolean, description: rowEstimate is an exact count(*), not a planner estimate }
        statsStale: { type: boolean }
        sizeBytes: { type: integer, format: int64 }
        comment: { type: string }
        readable: { type: boolean }
        partitions: { type: array, items: { type: string } }
        columns: { type: array, items: { $ref: '#/components/schemas/SourceColumn' } }
        primaryKey: { type: array, items: { type: string } }
        uniqueConstraints: { type: array, items: { type: array, items: { type: string } } }
        foreignKeys:
          type: array
          items:
            type: object
            required: [name, columns, refSchema, refTable, refColumns]
            properties:
              name: { type: string }
              columns: { type: array, items: { type: string } }
              refSchema: { type: string }
              refTable: { type: string }
              refColumns: { type: array, items: { type: string } }
        referencedBy:
          type: array
          items:
            type: object
            required: [schema, table, name, columns, refColumns]
            properties:
              schema: { type: string }
              table: { type: string }
              name: { type: string }
              columns: { type: array, items: { type: string } }
              refColumns: { type: array, items: { type: string } }
        indexes:
          type: array
          items:
            type: object
            required: [name, columns, unique]
            properties:
              name: { type: string }
              columns: { type: array, items: { type: string } }
              unique: { type: boolean }
              primary: { type: boolean }
    JsonType:
      type: string
      enum: [integer, number, boolean, string, datetime, any, array]
    SourceColumn:
      type: object
      required: [name, ordinal, dataType, udtName, nullable, default, isPrimaryKey, isUnique, maxLength, numericPrecision, numericScale, isArray, enumValues, jsonType]
      properties:
        name: { type: string }
        ordinal: { type: integer }
        dataType: { type: string }
        udtName: { type: string }
        nullable: { type: boolean }
        default: { type: [string, 'null'] }
        isPrimaryKey: { type: boolean }
        isUnique: { type: boolean }
        isIdentity: { type: boolean }
        isGenerated: { type: boolean }
        maxLength: { type: [integer, 'null'] }
        numericPrecision: { type: [integer, 'null'] }
        numericScale: { type: [integer, 'null'] }
        isArray: { type: boolean }
        elementType: { $ref: '#/components/schemas/JsonType' }
        enumValues: { type: [array, 'null'], items: { type: string } }
        comment: { type: string }
        jsonType: { $ref: '#/components/schemas/JsonType' }
        warning: { type: string }
    PreviewResult:
      type: object
      required: [schema, table, snapshotId, columns, orderBy, limit, rows]
      properties:
        schema: { type: string }
        table: { type: string }
        snapshotId: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, dataType, jsonType]
            properties:
              name: { type: string }
              dataType: { type: string }
              jsonType: { $ref: '#/components/schemas/JsonType' }
        orderBy: { type: array, items: { type: string } }
        limit: { type: integer }
        rows:
          type: array
          items:
            type: array
            items: { $ref: '#/components/schemas/PreviewCell' }
    PreviewCell:
      type: object
      required: [v, t]
      properties:
        v: { description: 'The encoded value (null, boolean, number, string, array or JSON)' }
        t: { $ref: '#/components/schemas/JsonType' }
        truncated: { type: boolean, description: 'Longer than the display limit (1 KB text, 256 B binary); v holds up to 64 KB' }
    BucketList:
      type: object
      required: [buckets, partial, capabilities]
      properties:
        buckets: { type: array, items: { $ref: '#/components/schemas/BucketInfo' } }
        partial: { type: boolean, description: 'The credential cannot list buckets; the list comes from its roles (may be empty)' }
        capabilities: { $ref: '#/components/schemas/TargetCapabilities' }
    BucketInfo:
      type: object
      required: [name, numReplicas, canManage]
      properties:
        name: { type: string }
        type: { type: string, enum: [couchbase, ephemeral] }
        ramQuotaMB: { type: integer }
        numReplicas: { type: integer }
        storageBackend: { type: string }
        canManage: { type: boolean }
    TargetCapabilities:
      type: object
      required: [canListBuckets, canCreateBucket, canManageScopes, canWriteDocs, rangeScan, queryService, deployment, allBuckets]
      properties:
        canListBuckets: { type: boolean }
        canCreateBucket: { type: boolean }
        canManageScopes: { type: boolean }
        canWriteDocs: { type: boolean }
        rangeScan: { type: boolean }
        queryService: { type: boolean }
        deployment: { type: string }
        bucketsAllowed: { type: array, items: { type: string } }
        allBuckets: { type: boolean }
        reasons: { type: array, items: { type: string } }
    ScopeInfo:
      type: object
      required: [name, collections]
      properties:
        name: { type: string }
        collections: { type: array, items: { $ref: '#/components/schemas/CollectionInfo' } }
    CollectionInfo:
      type: object
      required: [name, maxExpirySec]
      properties:
        name: { type: string }
        maxExpirySec: { type: integer, format: int64 }
        history: { type: boolean }
        docCountEstimate: { type: integer, format: int64 }
    CreateBucketRequest:
      type: object
      required: [name, ramQuotaMB, bucketType]
      properties:
        name: { type: string }
        ramQuotaMB: { type: integer }
        bucketType: { type: string, enum: [couchbase, ephemeral] }
        numReplicas: { type: integer, minimum: 0, maximum: 3 }
        storageBackend: { type: string, enum: [couchstore, magma] }
        flushEnabled: { type: boolean }
    KeyspaceCreateResult:
      type: object
      required: [status, bucket]
      properties:
        status: { type: string, enum: [ready, pending] }
        bucket: { type: string }
        scope: { type: string }
        collection: { type: string }
    FieldType:
      type: string
      enum: [string, integer, number, boolean, datetime, object, array, any]
    DocField:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        description: { type: string }
        children: { type: array, items: { $ref: '#/components/schemas/DocField' } }
        items: { $ref: '#/components/schemas/DocField' }
        format: { type: string }
        binding: { $ref: '#/components/schemas/Binding' }
        example:
          description: A scalar value from an imported design (OC-059), shown next to the field; never written to documents
          oneOf: [{ type: string }, { type: number }, { type: boolean }]
    Binding:
      type: object
      description: >-
        Document composer metadata on an object or array node (OC-047). relationId mirrors the
        relation whose targetFieldId is this node (the relation is authoritative); adapter lets a
        node take a relation of the other cardinality.
      properties:
        relationId: { type: string }
        adapter:
          type: string
          enum: [first, wrap]
          description: first — an object bound to one-to-many or many-to-many takes its first row (in the relation's order); wrap — an array bound to many-to-one holds 0 or 1 item
    DocSchema:
      type: object
      required: [root, source]
      properties:
        root: { $ref: '#/components/schemas/DocField' }
        source: { type: string, enum: [generated, json-sample, json-schema, collection-sample, manual] }
        reference:
          type: object
          additionalProperties: true
          description: The first imported sample, verbatim (≤ 256 KB, OC-059). Design-time only; never exported in a bundle.
        imported: { $ref: '#/components/schemas/ImportedDesign' }
        constantHints:
          type: array
          description: Fields whose imported values look fixed; the composer offers to keep each as a constant (OC-059)
          items: { $ref: '#/components/schemas/ConstantHint' }
    ImportedDesign:
      type: object
      description: The customer design a mapping was built from (OC-059); unlike source it survives edits
      required: [at, format, samples, fieldCount]
      properties:
        at: { type: string, format: date-time }
        fileName: { type: string }
        format: { type: string, enum: [sample, ndjson, json-schema] }
        samples: { type: integer }
        fieldCount: { type: integer }
        fields:
          type: array
          description: The imported design's fields as the customer defined them (paths like items[].sku); what conformance is checked against
          items:
            type: object
            required: [path, type]
            properties:
              path: { type: string }
              type: { $ref: '#/components/schemas/FieldType' }
              required: { type: boolean }
    ConstantHint:
      type: object
      required: [fieldId, value, reason]
      properties:
        fieldId: { type: string }
        value: { oneOf: [{ type: string }, { type: number }, { type: boolean }] }
        reason: { type: string, enum: [same-in-every-sample, discriminator-name, schema-const] }
    TransformStep:
      type: object
      required: [op]
      properties:
        op: { type: string }
        args: { type: object, additionalProperties: true }
    FieldMapping:
      type: object
      required: [id, targetFieldId, sources, transforms, origin, state]
      properties:
        id: { type: string }
        targetFieldId: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [column]
            properties:
              relation: { type: string, description: The relation whose table the column belongs to (absent for the mapped table) }
              column: { type: string }
              from: { type: string, enum: [via], description: 'Read a many-to-many junction column (OC-044)' }
              embed: { type: string, deprecated: true, description: '1.0 name of relation; accepted on input, never returned' }
        transforms: { type: array, items: { $ref: '#/components/schemas/TransformStep' } }
        origin: { type: string, enum: [auto, suggested, manual] }
        state: { type: string, enum: [active, pending, rejected] }
        confidence: { type: number }
        reason: { type: string }
        needsReview: { type: boolean }
        nullHandling: { type: string, enum: [include, omit] }
    MappingSpec:
      type: object
      description: >-
        Mapping spec v2 (OC-037). A 1.0 spec (no specVersion, embeds[] instead of relations[]) is
        still accepted on input and upgraded; responses are always v2.
      required: [specVersion, mode, docSchema, key, typeField, nullHandling, fieldMappings, relations, aggregates, ignoredColumns]
      properties:
        specVersion: { type: integer, enum: [2] }
        mode: { type: string, enum: [canvas, composed] }
        root:
          type: object
          required: [table]
          properties:
            table: { $ref: '#/components/schemas/TableRef' }
            groupBy:
              type: array
              items: { type: string }
              description: One document per distinct value of these driving-table columns, not per row (OC-063; composed mappings). The group's rows fill the relation with group true.
        docSchema: { $ref: '#/components/schemas/DocSchema' }
        key:
          type: object
          required: [template]
          properties:
            template: { type: string }
        typeField:
          type: object
          required: [enabled, name, value]
          properties:
            enabled: { type: boolean }
            name: { type: string }
            value: { type: string }
        nullHandling: { type: string, enum: [include, omit] }
        omitUnmapped:
          type: boolean
          description: Leave designed fields without an active mapping out of the document (default false writes them as null).
        referenceStrict:
          type: boolean
          description: Conformance to the imported design (REFERENCE_FIELD_UNMAPPED, REFERENCE_EXTRA_FIELD) is an error, blocking migrations and exports (OC-061)
        expirySec: { type: integer, format: int64 }
        fieldMappings: { type: array, items: { $ref: '#/components/schemas/FieldMapping' } }
        relations: { type: array, items: { $ref: '#/components/schemas/Relation' } }
        aggregates: { type: array, items: { $ref: '#/components/schemas/Aggregate' } }
        ignoredColumns: { type: array, items: { type: string } }
    TableRef:
      type: object
      required: [schema, name]
      properties:
        schema: { type: string }
        name: { type: string }
    JoinPair:
      type: object
      required: [parent, child]
      properties:
        parent: { type: string }
        child: { type: string }
    EmbedOrder:
      type: object
      required: [column]
      properties:
        column: { type: string }
        desc: { type: boolean }
        from: { type: string, enum: [via], description: 'A many-to-many junction column' }
    EmbedKind:
      type: string
      enum: [many-to-one, one-to-many]
    RelationKind:
      type: string
      enum: [many-to-one, one-to-many, many-to-many]
    Relation:
      type: object
      description: >-
        A related table in the document (spec v2). Relations form a tree through parentId (null
        = a child of the mapped table; nested up to OC_MAX_RELATION_DEPTH, OC-043); 1.0 embeds are
        relations at depth 1. lookupOnly many-to-one relations add no field (their columns are
        mapped in scope); many-to-many relations go through via (OC-044); arrays have a shape,
        filter and aggregates (OC-045) and an overflow policy and strategy (OC-046).
      required: [id, parentId, kind, table]
      properties:
        id: { type: string }
        parentId: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/RelationKind' }
        table: { $ref: '#/components/schemas/TableRef' }
        join: { type: array, items: { $ref: '#/components/schemas/JoinPair' } }
        via:
          type: object
          required: [table, parentJoin, childJoin]
          properties:
            table: { $ref: '#/components/schemas/TableRef' }
            parentJoin: { type: array, items: { type: object, required: [via], properties: { parent: { type: string }, via: { type: string } } } }
            childJoin: { type: array, items: { type: object, required: [via], properties: { via: { type: string }, child: { type: string } } } }
            columns: { type: array, items: { type: string } }
        targetFieldId: { type: string }
        lookupOnly: { type: boolean }
        shape: { type: string, enum: [objects, scalars, keyed] }
        valueColumn: { type: string }
        keyColumn: { type: string }
        orderBy: { type: array, items: { $ref: '#/components/schemas/EmbedOrder' } }
        limit: { type: integer, minimum: 0, maximum: 100000 }
        filter:
          type: array
          items:
            type: object
            required: [column, op]
            properties:
              column: { type: string }
              op: { type: string, enum: [eq, ne, lt, lte, gt, gte, in, notIn, isNull, notNull, like] }
              value: {}
              from: { type: string, enum: [via] }
        overflow: { type: string, enum: [truncate, fail, split] }
        strategy: { type: string, enum: [auto, batched, sorted-merge] }
        empty: { type: string, enum: [array, omit] }
        distinct: { type: boolean, description: 'Many-to-many: one item per target row' }
        keepDangling: { type: boolean, description: 'Many-to-many: keep junction rows whose target row is missing' }
        group:
          type: boolean
          description: 'The group''s rows (OC-063): a one-to-many from the driving table to itself on root.groupBy, directly under the root; table, kind and join are filled from the root'
    Aggregate:
      type: object
      required: [id, relationId, fn, targetFieldId]
      properties:
        id: { type: string }
        relationId: { type: string }
        fn: { type: string, enum: [count, sum, min, max, avg, first, last] }
        column: { type: string }
        from: { type: string, enum: [via] }
        targetFieldId: { type: string }
    EmbedCandidate:
      type: object
      required: [kind, table, join, constraint]
      properties:
        kind: { $ref: '#/components/schemas/EmbedKind' }
        table: { $ref: '#/components/schemas/TableRef' }
        join: { type: array, items: { $ref: '#/components/schemas/JoinPair' } }
        constraint: { type: string }
        rowEstimate: { type: [integer, 'null'], format: int64 }
        rowsPerParent: { type: number }
        embedId: { type: string }
        virtual: { type: string, description: 'The virtual relationship this candidate comes from (OC-042)' }
    EmbedTable:
      type: object
      required: [table, columns]
      properties:
        table: { $ref: '#/components/schemas/TableRef' }
        columns: { type: array, items: { $ref: '#/components/schemas/SourceColumn' } }
        via: { type: array, description: 'A many-to-many relation''s junction payload columns', items: { $ref: '#/components/schemas/SourceColumn' } }
    AddEmbedRequest:
      type: object
      description: 'A relation to add (OC-021; nested, lookup-only, many-to-many, shapes and paths from OC-043 – OC-045). Then are further hops, each nested under the one before.'
      required: [kind, table]
      properties:
        kind: { $ref: '#/components/schemas/RelationKind' }
        parentId: { type: string }
        table: { $ref: '#/components/schemas/TableRef' }
        join: { type: array, items: { $ref: '#/components/schemas/JoinPair' } }
        via: { $ref: '#/components/schemas/RelationVia' }
        lookupOnly: { type: boolean }
        targetName: { type: string }
        orderBy: { type: array, items: { $ref: '#/components/schemas/EmbedOrder' } }
        limit: { type: integer, minimum: 0, maximum: 100000 }
        empty: { type: string, enum: [array, omit] }
        shape: { type: string, enum: [objects, scalars, keyed] }
        valueColumn: { type: string }
        keyColumn: { type: string }
        filter: { type: array, items: { $ref: '#/components/schemas/RelationFilter' } }
        overflow: { type: string, enum: [truncate, fail, split] }
        strategy: { type: string, enum: [auto, batched, sorted-merge] }
        distinct: { type: boolean }
        keepDangling: { type: boolean }
        noField: { type: boolean }
        aggregates:
          type: array
          items:
            type: object
            required: [fn]
            properties:
              fn: { type: string, enum: [count, sum, min, max, avg, first, last] }
              column: { type: string }
              from: { type: string, enum: [via] }
              targetName: { type: string }
        generate: { type: boolean }
        includeJoinColumns: { type: boolean }
        then: { type: array, items: { $ref: '#/components/schemas/AddEmbedRequest' } }
    SuggestBindingsRequest:
      type: object
      properties:
        nodeId: { type: string, description: Only this node's suggestion (default every unbound object and array) }
        root: { type: boolean, description: Also rank driving tables from the root's fields }
        specOverride: { $ref: '#/components/schemas/MappingSpec' }
    BindingSuggestions:
      type: object
      required: [root, suggestions]
      properties:
        root:
          type: array
          items:
            type: object
            required: [table, score, reasons]
            properties:
              table: { $ref: '#/components/schemas/TableRef' }
              score: { type: number }
              reasons: { type: array, items: { type: string } }
        suggestions: { type: array, items: { $ref: '#/components/schemas/BindingSuggestion' } }
    BindingSuggestion:
      type: object
      required: [nodeId, path, confidence, candidate, alternatives]
      properties:
        nodeId: { type: string }
        path: { type: string }
        confidence: { type: string, enum: [high, medium, unresolved], description: 'high ≥ 0.75, medium ≥ 0.50; unresolved shows its best candidate without suggesting it' }
        candidate: { $ref: '#/components/schemas/BindingCandidate' }
        alternatives: { type: array, items: { $ref: '#/components/schemas/BindingCandidate' } }
    BindingCandidate:
      type: object
      required: [score, reasons]
      properties:
        fromParent: { type: boolean, description: No relation — the object groups its parent scope's columns }
        kind: { type: string, enum: [many-to-one, one-to-many, many-to-many] }
        table: { $ref: '#/components/schemas/TableRef' }
        join: { type: array, items: { $ref: '#/components/schemas/JoinPair' } }
        via: { $ref: '#/components/schemas/RelationVia' }
        virtual: { type: boolean }
        adapter: { type: string, enum: [first, wrap] }
        shape: { type: string, enum: [scalars] }
        valueColumn: { type: string }
        group: { type: boolean, description: Fill the array with the group's rows, grouping the driving table by groupBy (OC-063) }
        groupBy: { type: array, items: { type: string } }
        orderBy: { type: array, items: { $ref: '#/components/schemas/EmbedOrder' } }
        score: { type: number }
        reasons: { type: array, items: { type: string } }
    RelationVia:
      type: object
      required: [table, parentJoin, childJoin]
      properties:
        table: { $ref: '#/components/schemas/TableRef' }
        parentJoin: { type: array, items: { $ref: '#/components/schemas/ViaJoin' } }
        childJoin: { type: array, items: { $ref: '#/components/schemas/ViaJoin' } }
        columns: { type: array, items: { type: string } }
    ViaJoin:
      type: object
      required: [via]
      properties:
        parent: { type: string }
        via: { type: string }
        child: { type: string }
    RelationFilter:
      type: object
      required: [column, op]
      properties:
        column: { type: string }
        op: { type: string, enum: [eq, ne, lt, lte, gt, gte, in, notIn, isNull, notNull, like] }
        value: {}
        from: { type: string, enum: [via] }
    RelationHop:
      type: object
      required: [from, to, kind, join, indexed]
      properties:
        from: { $ref: '#/components/schemas/TableRef' }
        to: { $ref: '#/components/schemas/TableRef' }
        kind: { $ref: '#/components/schemas/EmbedKind' }
        join: { type: array, items: { $ref: '#/components/schemas/JoinPair' } }
        constraint: { type: string }
        relationshipId: { type: string }
        virtual: { type: boolean }
        indexed: { type: boolean }
    RelationPath:
      type: object
      required: [hops]
      properties:
        hops: { type: array, items: { $ref: '#/components/schemas/RelationHop' } }
    JunctionCandidate:
      type: object
      required: [table, via, parentJoin, childJoin, payloadColumns, confidence, indexed]
      properties:
        table: { $ref: '#/components/schemas/TableRef' }
        via: { $ref: '#/components/schemas/TableRef' }
        parentJoin: { type: array, items: { $ref: '#/components/schemas/ViaJoin' } }
        childJoin: { type: array, items: { $ref: '#/components/schemas/ViaJoin' } }
        payloadColumns: { type: array, items: { type: string } }
        confidence: { type: string, enum: [high, medium] }
        indexed: { type: boolean }
    IndexAdvice:
      type: object
      required: [code, table, columns, message]
      properties:
        code: { type: string, enum: [RELATION_NO_INDEX] }
        table: { $ref: '#/components/schemas/TableRef' }
        columns: { type: array, items: { type: string } }
        message: { type: string }
    RelationGraph:
      type: object
      required: [root, depth, paths, junctions, advice]
      properties:
        root: { $ref: '#/components/schemas/TableRef' }
        depth: { type: integer }
        paths: { type: array, items: { $ref: '#/components/schemas/RelationPath' } }
        junctions: { type: array, items: { $ref: '#/components/schemas/JunctionCandidate' } }
        advice: { type: array, items: { $ref: '#/components/schemas/IndexAdvice' } }
    RelationshipEnd:
      type: object
      required: [schema, table, columns]
      properties:
        schema: { type: string }
        table: { type: string }
        columns: { type: array, items: { type: string } }
    RelationshipDetection:
      type: object
      required: [maxPerKey, fromMaxPerKey, sampledRows, suggested, at]
      properties:
        maxPerKey: { type: integer, format: int64 }
        fromMaxPerKey: { type: integer, format: int64 }
        sampledRows: { type: integer, format: int64 }
        suggested: { type: string, enum: [many-to-one, one-to-one, one-to-many, unknown] }
        at: { type: string, format: date-time }
        warning: { type: string }
    RelationshipInput:
      type: object
      required: [from, to]
      properties:
        name: { type: string }
        from: { $ref: '#/components/schemas/RelationshipEnd' }
        to: { $ref: '#/components/schemas/RelationshipEnd' }
        cardinality: { type: string, enum: [many-to-one, one-to-one, one-to-many] }
        detected: { $ref: '#/components/schemas/RelationshipDetection' }
    Relationship:
      type: object
      required: [id, projectId, name, from, to, cardinality, version]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        projectId: { type: string }
        name: { type: string }
        from: { $ref: '#/components/schemas/RelationshipEnd' }
        to: { $ref: '#/components/schemas/RelationshipEnd' }
        cardinality: { type: string, enum: [many-to-one, one-to-one, one-to-many] }
        detected: { $ref: '#/components/schemas/RelationshipDetection' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    Location:
      type: object
      description: 'Where a mapping writes (OC-036): {kind: couchbase, bucket, scope, collection} or {kind: directory, folder}.'
      required: [kind]
      properties:
        kind: { type: string, enum: [couchbase, directory] }
        bucket: { type: string }
        scope: { type: string }
        collection: { type: string }
        folder: { type: string, description: 'Relative to the directory target''s root, e.g. "orders" or "archive/2026"' }
        createIfMissing: { type: boolean }
    StoredDocument:
      type: object
      required: [key, bytes, document, location]
      properties:
        key: { type: string }
        path: { type: string, description: 'The file, relative to the target folder (directories)' }
        bytes: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        document: {}
        location: { $ref: '#/components/schemas/Location' }
    OutputPage:
      type: object
      required: [mappingId, location, items, nextCursor]
      properties:
        mappingId: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        items:
          type: array
          items:
            type: object
            required: [key, path, bytes]
            properties:
              key: { type: string }
              path: { type: string }
              bytes: { type: integer, format: int64 }
        nextCursor: { type: string }
    FolderListing:
      type: object
      required: [path, parent, folders, canCreate]
      properties:
        path: { type: string, description: '"" lists the areas' }
        parent: { type: string, description: 'Where "up" goes; "" from an area''s top folder' }
        folders: { type: array, items: { $ref: '#/components/schemas/FolderEntry' } }
        canCreate: { type: boolean }
        where: { $ref: '#/components/schemas/FolderWhere' }
        hostPath: { type: string, description: 'Path on the user''s computer when shared into the all-in-one image (OC-080)' }
    FolderEntry:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
        hostPath: { type: string, description: 'The folder on the user''s computer when it''s shared into the all-in-one image (OC-080)' }
        where: { $ref: '#/components/schemas/FolderWhere' }
        label: { type: string, description: 'An area''s label for users, e.g. "Your computer: /Users/ana/omni-data-bus-output"' }
    FolderWhere:
      type: string
      enum: [computer, container]
      description: >-
        All-in-one image only (OC-080): computer = a folder of the user's computer shared into the
        container; container = inside the container only. Absent on a regular server.
    SharedFolder:
      type: object
      required: [path, hostPath]
      properties:
        path: { type: string, example: /data }
        hostPath: { type: string, example: /Users/ana/omni-data-bus-output }
    LocationNode:
      type: object
      required: [name, level, path, location, leaf, canCreate]
      properties:
        name: { type: string }
        level: { type: string, enum: [bucket, scope, collection, folder] }
        path: { type: string, description: The parent to list this node's children with }
        location: { $ref: '#/components/schemas/Location' }
        leaf: { type: boolean, description: A mapping can write here }
        docCount: { type: integer, format: int64 }
        docCountMore: { type: boolean, description: More than docCount (a capped count, e.g. "10,000+") }
        canCreate: { type: boolean }
    LocationList:
      type: object
      required: [kind, parent, nodes]
      properties:
        kind: { type: string }
        parent: { type: string }
        nodes: { type: array, items: { $ref: '#/components/schemas/LocationNode' } }
    LocationCreated:
      type: object
      required: [status, location]
      properties:
        status: { type: string, enum: [ready, pending] }
        location: { $ref: '#/components/schemas/Location' }
    TargetKindCapabilities:
      type: object
      required: [supportsDurability, supportsExpiry, supportsCreateLocation, requiresCredentials, maxDocBytes, locationLevels]
      properties:
        supportsDurability: { type: boolean }
        supportsExpiry: { type: boolean }
        supportsCreateLocation: { type: boolean }
        requiresCredentials: { type: boolean }
        maxDocBytes: { type: integer, format: int64 }
        locationLevels: { type: array, items: { type: string } }
    TargetKind:
      allOf:
        - { $ref: '#/components/schemas/ConnectorDescriptor' }
        - type: object
          required: [kindCapabilities, enabled]
          properties:
            kindCapabilities: { $ref: '#/components/schemas/TargetKindCapabilities' }
            enabled: { type: boolean }
            disabledReason: { type: string }
            sharedFolder: { $ref: '#/components/schemas/SharedFolder' }
    TargetKindList:
      type: object
      required: [kinds]
      properties:
        kinds: { type: array, items: { $ref: '#/components/schemas/TargetKind' } }
        bundled: { $ref: '#/components/schemas/BundledTarget' }
    BundledTarget:
      type: object
      description: The Couchbase node bundled in the all-in-one image (OC-072); absent elsewhere.
      required: [kind, label, buckets]
      properties:
        kind: { type: string, enum: [couchbase] }
        label: { type: string, example: Bundled Couchbase (this container) }
        buckets: { type: array, items: { type: string }, example: [sandbox] }
    BundledTargetSaved:
      type: object
      required: [connection, test]
      properties:
        connection: { $ref: '#/components/schemas/Connection' }
        test: { $ref: '#/components/schemas/TestResult' }
    MappingTarget:
      type: object
      description: The 1.0 Couchbase form of Location (empty for other kinds).
      required: [bucket, scope, collection]
      properties:
        bucket: { type: string }
        scope: { type: string }
        collection: { type: string }
        createIfMissing: { type: boolean }
    MappingStats:
      type: object
      required: [totalSourceColumns, autoMapped, suggested, manuallyMapped, unmappedSource, ignored, totalTargetLeaves, mappedTargetLeaves, requiredTargetUnmapped, autoMapRatio, coverageRatio, averageConfidence]
      properties:
        totalSourceColumns: { type: integer }
        autoMapped: { type: integer }
        suggested: { type: integer }
        manuallyMapped: { type: integer }
        unmappedSource: { type: integer }
        ignored: { type: integer }
        totalTargetLeaves: { type: integer }
        mappedTargetLeaves: { type: integer }
        requiredTargetUnmapped: { type: integer }
        autoMapRatio: { type: number }
        coverageRatio: { type: number }
        averageConfidence: { type: number }
        embedded:
          type: object
          description: Columns of embedded tables, counted separately
          required: [tables, totalColumns, autoMapped, manuallyMapped, suggested, unmappedSource]
          properties:
            tables: { type: integer }
            totalColumns: { type: integer }
            autoMapped: { type: integer }
            manuallyMapped: { type: integer }
            suggested: { type: integer }
            unmappedSource: { type: integer }
        byNode:
          type: array
          description: 'The score per bound scope, root first: "root 8/10 · items 5/6 · items.product 3/3" (OC-049)'
          items: { $ref: '#/components/schemas/NodeScore' }
    NodeScore:
      type: object
      required: [nodeId, path, mapped, total]
      properties:
        nodeId: { type: string, description: The bound node (fld_root for the root) }
        relationId: { type: string }
        path: { type: string, description: 'Dotted field names, e.g. items.product ("root" for the root)' }
        mapped: { type: integer }
        total: { type: integer }
    MappingIssue:
      type: object
      required: [severity, code, path, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        path: { type: string }
        message: { type: string }
        fieldId: { type: string }
        fieldMappingId: { type: string }
        fix:
          type: object
          required: [kind, label]
          properties:
            kind: { type: string, enum: [mark-optional, accept-suggestions, add-transform, enable-create, repoint-source, combine-rows, add-to-design, restore-field, map-field] }
            label: { type: string }
            step: { $ref: '#/components/schemas/TransformStep' }
            relationId: { type: string, description: 'repoint-source: read the column from this relation (OC-065)' }
            columns: { type: array, items: { type: string }, description: 'combine-rows: group by these key columns (OC-066); restore-field and map-field: map from the first, of relationId''s rows (OC-071)' }
        op: { type: string }
        opIndex: { type: integer }
        line: { type: integer }
        column: { type: integer }
        nodePath: { type: string, description: 'The design node the issue is on, e.g. items[].product (OC-049)' }
        relationId: { type: string, description: The relation the issue is about, when it's a binding's }
    Explanation:
      type: object
      required: [score, nameScore, typeScore, typeClass, signals, reason]
      properties:
        score: { type: number }
        nameScore: { type: number }
        typeScore: { type: number }
        typeClass: { type: string }
        reason: { type: string }
        signals:
          type: array
          items:
            type: object
            required: [name, score]
            properties:
              name: { type: string }
              score: { type: number }
              sourceVariant: { type: string }
              targetVariant: { type: string }
              details: { type: string }
    MappingStatus:
      type: string
      enum: [draft, ready, stale]
    MappingView:
      type: object
      required: [id, projectId, sourceSchema, sourceTable, target, location, spec, status, stats, issues, explain, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        sourceSchema: { type: string }
        sourceTable: { type: string }
        target: { $ref: '#/components/schemas/MappingTarget' }
        location: { $ref: '#/components/schemas/Location' }
        spec: { $ref: '#/components/schemas/MappingSpec' }
        status: { $ref: '#/components/schemas/MappingStatus' }
        automapStats: { $ref: '#/components/schemas/MappingStats' }
        stats: { $ref: '#/components/schemas/MappingStats' }
        issues: { type: array, items: { $ref: '#/components/schemas/MappingIssue' } }
        explain: { type: object, additionalProperties: { $ref: '#/components/schemas/Explanation' } }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        embedTables: { type: object, additionalProperties: { $ref: '#/components/schemas/EmbedTable' } }
        embedCandidates: { type: array, items: { $ref: '#/components/schemas/EmbedCandidate' } }
    MappingSummary:
      type: object
      required: [id, sourceSchema, sourceTable, mode, driving, target, location, status, stats, version, updatedAt, errors, warnings]
      properties:
        id: { type: string }
        sourceSchema: { type: string }
        sourceTable: { type: string }
        mode: { type: string, enum: [canvas, composed] }
        driving: { $ref: '#/components/schemas/TableRef', description: "The table whose rows become documents: a composed mapping's driving table, else the mapping's own (OC-047)" }
        target: { $ref: '#/components/schemas/MappingTarget' }
        location: { $ref: '#/components/schemas/Location' }
        status: { $ref: '#/components/schemas/MappingStatus' }
        automapStats: { $ref: '#/components/schemas/MappingStats' }
        stats: { $ref: '#/components/schemas/MappingStats' }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        shape:
          type: object
          description: 'The document at a glance (OC-062): arrays and objects bound to tables, and the group-by columns'
          required: [arrays, objects]
          properties:
            arrays: { type: integer }
            objects: { type: integer }
            groupBy: { type: array, items: { type: string } }
        errors: { type: integer, description: 'Error issues in the live validation; any makes the status draft (OC-083)' }
        warnings: { type: integer }
        firstError:
          type: object
          description: 'What to fix first (OC-083)'
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    MappingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MappingSummary' } }
    CreateMappingRequest:
      type: object
      description: Send location (2.0) or target (1.0, Couchbase only); location wins when both are sent.
      required: [sourceSchema, sourceTable]
      properties:
        sourceSchema: { type: string }
        sourceTable: { type: string }
        target: { $ref: '#/components/schemas/MappingTarget' }
        location: { $ref: '#/components/schemas/Location' }
        generate:
          type: object
          properties:
            naming: { type: string, enum: [camelCase, snake_case, preserve] }
            nestByPrefix: { type: boolean }
    BulkCreateMappingsRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CreateMappingRequest' } }
    BulkCreateMappingsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [sourceSchema, sourceTable]
            properties:
              sourceSchema: { type: string }
              sourceTable: { type: string }
              mapping: { $ref: '#/components/schemas/MappingSummary' }
              error: { $ref: '#/components/schemas/Problem' }
    UpdateMappingRequest:
      type: object
      required: [spec]
      properties:
        spec: { $ref: '#/components/schemas/MappingSpec' }
        target: { $ref: '#/components/schemas/MappingTarget' }
        location: { $ref: '#/components/schemas/Location' }
    AutomapRequest:
      type: object
      properties:
        mode: { type: string, enum: [fill, reset] }
        includeManual: { type: boolean }
        nodeId:
          type: string
          description: 'Auto-map one bound scope only (OC-049): a bound node, or fld_root for the root-level fields. Fills unmapped fields; never changes mapped ones'
        allScopes: { type: boolean, description: Auto-map every bound scope from the root down (fill mode) }
    DesignRequest:
      type: object
      required: [docSchema, strategy]
      properties:
        docSchema: { $ref: '#/components/schemas/DocSchema' }
        strategy:
          type: string
          enum: [replace, merge, reconcile]
          description: reconcile follows a revised design, keeping the IDs, mappings and bindings of fields that still exist (OC-061)
        declined: { type: array, items: { type: string }, description: 'Current field ids whose proposed rename or move is refused (reconcile)' }
    DesignResult:
      type: object
      required: [mapping, orphans]
      properties:
        mapping: { $ref: '#/components/schemas/MappingView' }
        orphans: { type: array, items: { $ref: '#/components/schemas/FieldMapping' } }
        diff: { $ref: '#/components/schemas/DesignDiff' }
    DesignDiff:
      type: object
      required: [added, removed, typeChanged, renamed, moved]
      properties:
        added: { type: array, items: { $ref: '#/components/schemas/DiffField' } }
        removed: { type: array, items: { $ref: '#/components/schemas/DiffField' } }
        typeChanged:
          type: array
          items:
            type: object
            required: [fieldId, path, from, to]
            properties:
              fieldId: { type: string }
              path: { type: string }
              from: { $ref: '#/components/schemas/FieldType' }
              to: { $ref: '#/components/schemas/FieldType' }
        renamed: { type: array, items: { $ref: '#/components/schemas/DiffChange' } }
        moved: { type: array, items: { $ref: '#/components/schemas/DiffChange' } }
    DiffField:
      type: object
      required: [fieldId, path, type]
      properties:
        fieldId: { type: string }
        path: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
    DiffChange:
      type: object
      required: [fieldId, from, to]
      properties:
        fieldId: { type: string }
        from: { type: string }
        to: { type: string }
    ReconcileRequest:
      type: object
      required: [current, incoming]
      properties:
        current: { $ref: '#/components/schemas/DocSchema' }
        incoming: { $ref: '#/components/schemas/DocSchema' }
        declined: { type: array, items: { type: string } }
    ReconcileResult:
      type: object
      required: [docSchema, diff]
      properties:
        docSchema: { $ref: '#/components/schemas/DocSchema' }
        diff: { $ref: '#/components/schemas/DesignDiff' }
    ValidationResult:
      type: object
      required: [issues, status, ready]
      properties:
        issues: { type: array, items: { $ref: '#/components/schemas/MappingIssue' } }
        status: { $ref: '#/components/schemas/MappingStatus' }
        ready: { type: boolean }
    MappingPreviewRequest:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 50 }
        sampleMode: { type: string, enum: [first, random] }
        fieldMappingId: { type: string }
        specOverride: { $ref: '#/components/schemas/MappingSpec' }
        checkKeys: { type: boolean }
        writeMode: { type: string, enum: [upsert, insert] }
        rootKey:
          type: object
          additionalProperties: true
          description: 'Preview this root row: column → value of the driving table (e.g. {"order_id": 1001})'
        worstCase:
          type: string
          description: Preview the root row with the most rows of this relation (an array directly under the root, OC-049)
    NodeStats:
      type: object
      required: [rows, truncated, dangling, adapterDiscarded]
      properties:
        rows: { type: integer, description: Rows used in the preview document }
        total: { type: integer, format: int64, description: All related rows, when counted (arrays directly under the root) }
        truncated: { type: boolean, description: 'The preview read at most 50 rows per parent ("showing 50 of 1,240")' }
        dangling: { type: integer }
        adapterDiscarded: { type: integer, description: Rows the first adapter left out }
    RowError:
      type: object
      required: [code, message]
      properties:
        fieldPath: { type: string }
        op: { type: string }
        code: { type: string }
        message: { type: string }
    TraceStep:
      type: object
      required: [step, value]
      properties:
        step: { type: string }
        value: {}
    MappingPreview:
      type: object
      required: [writeMode]
      properties:
        writeMode: { type: string, enum: [upsert, insert] }
        items:
          type: array
          items:
            type: object
            required: [sourceRow, sizeBytes, warnings, error]
            properties:
              sourceRow: { type: object, additionalProperties: true }
              key: { type: string }
              document: { type: object, additionalProperties: true }
              sizeBytes: { type: integer }
              warnings: { type: array, items: { $ref: '#/components/schemas/RowError' } }
              error: { oneOf: [{ $ref: '#/components/schemas/RowError' }, { type: 'null' }] }
              trace: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/TraceStep' } } }
              keyExists: { type: boolean }
              path: { type: string, description: The file the document would be written to (directory targets) }
              stats: { type: object, additionalProperties: { $ref: '#/components/schemas/NodeStats' }, description: 'Per relation node, by dotted path (items, items.product)' }
              conformance:
                type: object
                description: The document's shape against the imported design (OC-061), by path; values aren't compared
                required: [missing, extra, typeDiff]
                properties:
                  missing: { type: array, items: { type: string } }
                  extra: { type: array, items: { type: string } }
                  typeDiff: { type: array, items: { type: string } }
        worstCase:
          type: object
          required: [relationId, path, rows, estimatedBytes]
          properties:
            relationId: { type: string }
            path: { type: string }
            rows: { type: integer, format: int64, description: The most rows of the relation under one root row }
            estimatedBytes: { type: integer, format: int64, description: The full document's estimated size with every row }
        summary:
          type: object
          required: [ok, errors, avgSizeBytes, maxSizeBytes, collisions]
          properties:
            ok: { type: integer }
            errors: { type: integer }
            avgSizeBytes: { type: integer }
            maxSizeBytes: { type: integer }
            collisions: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [before, after, steps]
            properties:
              before: {}
              after: {}
              error: { $ref: '#/components/schemas/RowError' }
              steps: { type: array, items: { $ref: '#/components/schemas/TraceStep' } }
    InferRequest:
      type: object
      required: [kind, content]
      properties:
        kind: { type: string, enum: [json-sample, json-schema] }
        content: { type: string }
        fileName: { type: string, maxLength: 255, description: The imported file's name, recorded in docSchema.imported }
    InferResult:
      type: object
      required: [docSchema, warnings]
      properties:
        docSchema: { $ref: '#/components/schemas/DocSchema' }
        warnings: { type: array, items: { type: string } }
        method: { type: string }
    JobStatus:
      type: string
      enum: [queued, running, pausing, paused, cancelling, cancelled, completed, completed_with_errors, failed]
    JobOptions:
      type: object
      properties:
        mappingIds: { type: array, items: { type: string } }
        writeMode: { type: string, enum: [upsert, insert, replace] }
        batchSize: { type: integer, minimum: 100, maximum: 10000 }
        readParallelism: { type: string, description: '"auto" or "1".."8"' }
        writeConcurrency: { type: integer, minimum: 1, maximum: 512 }
        tableConcurrency: { type: integer, minimum: 1, maximum: 6 }
        maxDocsPerSecond: { type: [integer, 'null'], minimum: 1 }
        durability: { type: string, enum: [none, majority, majorityAndPersistActive, persistToMajority] }
        errorPolicy:
          type: object
          properties:
            maxErrors: { type: integer, minimum: -1 }
            maxErrorRatio: { type: number, minimum: 0, maximum: 1 }
            minRowsForRatio: { type: integer, minimum: 0 }
        exactCount: { type: string, enum: [auto, always, never] }
        verifySampleSize: { type: integer, minimum: 0, maximum: 10000 }
        retryOf: { type: string }
        keyFilter: { type: string }
        onlyCodes: { type: array, items: { type: string } }
        mappingVersions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Each mapping's version when the job was created (its spec is frozen server-side)
        planHashes:
          type: object
          additionalProperties: { type: string }
          description: Each mapping's execution plan hash when the job was created (OC-037); equal hashes build equal documents
    MappingRef:
      type: object
      required: [mappingId, table]
      properties:
        mappingId: { type: string }
        table: { type: string }
    ResumeInfo:
      type: object
      required: [rowsDone, changed, restart]
      properties:
        rowsDone: { type: integer, format: int64, description: Rows the checkpoint covers }
        changed: { type: array, items: { $ref: '#/components/schemas/MappingRef' }, description: Mappings edited since the job started }
        restart: { type: array, items: { $ref: '#/components/schemas/MappingRef' }, description: Unfinished tables without a primary key (re-read from the start) }
    PreflightCheck:
      type: object
      required: [id, label, status]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, warn, fail, skipped] }
        detail: { type: string }
        hint: { type: string }
        code: { type: string }
        mappingId: { type: string }
    PlannedMapping:
      type: object
      required: [mappingId, table, target, location, rowEstimate]
      properties:
        mappingId: { type: string }
        table: { type: string }
        target: { $ref: '#/components/schemas/MappingTarget' }
        location: { $ref: '#/components/schemas/Location' }
        rowEstimate: { type: integer, format: int64 }
    PreflightResult:
      type: object
      required: [ok, checks, mappings, totalRows]
      properties:
        ok: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/PreflightCheck' } }
        mappings: { type: array, items: { $ref: '#/components/schemas/PlannedMapping' } }
        totalRows: { type: integer, format: int64 }
    MappingProgress:
      type: object
      required: [mappingId, table, target, phase, processed, total, totalKind, percent, written, skipped, failed]
      properties:
        mappingId: { type: string }
        table: { type: string }
        target: { type: string }
        phase: { type: string, enum: [queued, preparing, migrating, verifying, done, failed] }
        processed: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        totalKind: { type: string, enum: [estimate, exact] }
        percent: { type: number }
        written: { type: integer, format: int64 }
        skipped: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    ErrorSample:
      type: object
      required: [at, mappingId, table, stage, code, message]
      properties:
        at: { type: string, format: date-time }
        mappingId: { type: string }
        table: { type: string }
        stage: { type: string }
        code: { type: string }
        message: { type: string }
        fieldPath: { type: string }
        sourceKey: {}
    ProgressSnapshot:
      type: object
      required: [jobId, status, seq, ts, total, totalKind, processed, percent, written, skipped, failed, rowsRead, bytesWritten, throughput, peakThroughput, etaSeconds, elapsedSeconds, mappings, errorsByCode]
      properties:
        jobId: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        seq: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        total: { type: integer, format: int64 }
        totalKind: { type: string, enum: [estimate, exact] }
        processed: { type: integer, format: int64 }
        percent: { type: number }
        written: { type: integer, format: int64 }
        skipped: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        rowsRead: { type: integer, format: int64 }
        bytesWritten: { type: integer, format: int64 }
        throughput: { type: number }
        peakThroughput: { type: number }
        etaSeconds: { type: [integer, 'null'] }
        elapsedSeconds: { type: integer, format: int64 }
        mappings: { type: array, items: { $ref: '#/components/schemas/MappingProgress' } }
        errorsByCode:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer, format: int64 }
        errorSamples: { type: array, items: { $ref: '#/components/schemas/ErrorSample' } }
    Job:
      type: object
      required: [id, projectId, status, options, mappingIds, createdBy, createdAt, updatedAt, version, progress, resumable, retryable]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        reason: { type: string }
        reasonDetail: { type: string }
        options: { $ref: '#/components/schemas/JobOptions' }
        mappingIds: { type: array, items: { type: string } }
        errorsTruncated: { type: boolean }
        claimedBy: { type: string }
        heartbeatAt: { type: string, format: date-time }
        retryOf: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        progress: { $ref: '#/components/schemas/ProgressSnapshot' }
        resumable: { type: boolean }
        retryable: { type: boolean }
        resumeInfo: { $ref: '#/components/schemas/ResumeInfo' }
        origin: { type: string, enum: [external], description: 'external: a run of an exported bundle, imported from its report (OC-055); read-only' }
        external: { $ref: '#/components/schemas/ExternalRun' }
        minWorkerVersion: { type: string, description: 'Oldest worker release that can run the job (2.0.0 when it uses a 2.0-only feature); older workers never claim it (OC-057)' }
        minWorkerLevel: { type: integer }
    ExternalRun:
      type: object
      required: [runId, bundleSha256, exportId, odb, exitCode, durationSec, docsPerSec, errors, importedBy, importedAt, mappings]
      properties:
        runId: { type: string }
        bundleSha256: { type: string }
        exportId: { type: string }
        odb: { type: object, required: [version, commit], properties: { version: { type: string }, commit: { type: string } } }
        exitCode: { type: integer }
        durationSec: { type: number }
        docsPerSec: { type: number }
        errors:
          type: object
          required: [total, byCode, samples]
          properties:
            total: { type: integer, format: int64 }
            byCode:
              type: array
              items: { type: object, required: [stage, code, count], properties: { stage: { type: string }, code: { type: string }, count: { type: integer, format: int64 } } }
            samples: { type: array, items: { type: object, additionalProperties: true } }
        importedBy: { type: string }
        importedAt: { type: string, format: date-time }
        mappings:
          type: array
          items:
            type: object
            required: [id, name, table, target, phase, read, written, skipped, failed]
            properties:
              id: { type: string }
              name: { type: string }
              table: { type: string }
              target: { type: string }
              phase: { type: string }
              read: { type: integer, format: int64 }
              written: { type: integer, format: int64 }
              skipped: { type: integer, format: int64 }
              failed: { type: integer, format: int64 }
    ExportOptions:
      type: object
      required: [version, image, downloadUrl, downloadable, embeddable, maxPerHour, minPassphraseLength, stepUpWindowSec]
      properties:
        version: { type: string }
        image: { type: string }
        downloadUrl: { type: string }
        downloadable: { type: array, items: { type: string }, description: 'Platforms (os_arch) a script can download odb for (checksums known)' }
        embeddable: { type: array, items: { type: string }, description: Platforms this server can embed odb for }
        autoEmbed: { type: string, description: 'The platform (os_arch) an Automatic script carries odb for, because no platform can be downloaded; absent when downloads work' }
        maxPerHour: { type: integer }
        minPassphraseLength: { type: integer }
        stepUpWindowSec: { type: integer }
    ExportRequest:
      type: object
      description: >-
        How to package the export. What is exported is the project as configured — its source, target, saved
        credentials and every ready mapping; change them in the project's steps. The credentials are always sealed
        with the passphrase.
      required: [passphrase, runtime]
      properties:
        passphrase: { type: string, format: password, description: 'At least 12 characters and strong (PASSPHRASE_WEAK)' }
        runtime: { type: string, enum: [bundle, script] }
        script:
          type: object
          properties:
            runtime: { type: string, enum: [auto, binary, docker, embedded] }
            os: { type: string, enum: [linux, darwin] }
            arch: { type: string, enum: [amd64, arm64] }
            includeBundle: { type: boolean }
        jobOptions: { $ref: '#/components/schemas/JobOptions' }
    ExportRecord:
      type: object
      required: [id, projectId, createdBy, createdByEmail, createdAt, mappingIds, planHashes, targetType, credentialMode, runtime, odbVersion, bundleSha256, planHash, changed]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        projectId: { type: string }
        createdBy: { type: string }
        createdByEmail: { type: string }
        createdAt: { type: string, format: date-time }
        mappingIds: { type: array, items: { type: string } }
        planHashes: { type: object, additionalProperties: { type: string } }
        targetType: { type: string }
        credentialMode: { type: string, enum: [sealed, plaintext, external] }
        runtime: { type: string, enum: [bundle, script] }
        odbVersion: { type: string }
        bundleSha256: { type: string }
        planHash: { type: string }
        changed: { type: array, items: { type: string }, description: Exported mappings changed or deleted since }
    ExportHistory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExportRecord' } }
        nextCursor: { type: string }
    VerifyDiff:
      type: object
      required: [path, expected, actual]
      properties:
        path: { type: string }
        expected: {}
        actual: {}
    VerifyMismatch:
      type: object
      required: [key, expected, actual, diffs]
      properties:
        key: { type: string }
        sourceKey: {}
        expected: {}
        actual: {}
        diffs: { type: array, items: { $ref: '#/components/schemas/VerifyDiff' } }
    VerifySample:
      type: object
      required: [checked, matched, mismatched, missing, sourceChanged, missingKeys, mismatches]
      properties:
        checked: { type: integer }
        matched: { type: integer }
        mismatched: { type: integer }
        missing: { type: integer }
        sourceChanged: { type: integer }
        missingKeys: { type: array, items: { type: string } }
        mismatches: { type: array, items: { $ref: '#/components/schemas/VerifyMismatch' } }
    VerifyCounts:
      type: object
      required: [sourceRows, written, skipped, failed, duplicateKeys, expectedDocs, reconciled, warnings, messages]
      properties:
        sourceRows: { type: integer, format: int64 }
        written: { type: integer, format: int64 }
        skipped: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        distinctKeysEstimate: { type: integer, format: int64 }
        duplicateKeys: { type: integer, format: int64 }
        expectedDocs: { type: integer, format: int64 }
        targetCount: { type: integer, format: int64 }
        targetCountMatch: { type: boolean }
        reconciled: { type: boolean }
        warnings: { type: array, items: { type: string } }
        messages: { type: array, items: { type: string } }
    VerificationResult:
      type: object
      required: [mappingId, result, counts, avgDocBytes, throughputAvg, throughputPeak, durationSeconds]
      properties:
        mappingId: { type: string }
        result: { type: string, enum: [passed, passed_with_warnings, failed, skipped] }
        counts: { $ref: '#/components/schemas/VerifyCounts' }
        sample: { $ref: '#/components/schemas/VerifySample' }
        error: { type: string }
        targetKind: { type: string, enum: [couchbase, directory], description: 'What was counted: documents in a collection, or files in a folder' }
        integrity:
          type: object
          description: A directory's manifest checked against its files (OC-041)
          required: [listed, checked, missing, mismatched, issues]
          properties:
            listed: { type: integer }
            checked: { type: integer }
            missing: { type: integer }
            mismatched: { type: integer }
            issues:
              type: array
              items:
                type: object
                required: [key, path, problem]
                properties:
                  key: { type: string }
                  path: { type: string }
                  problem: { type: string, enum: [missing, hash_mismatch] }
        avgDocBytes: { type: integer, format: int64 }
        throughputAvg: { type: number }
        throughputPeak: { type: number }
        durationSeconds: { type: number }
    ReportEndpoint:
      type: object
      required: [type, host]
      properties:
        type: { type: string }
        host: { type: string }
        database: { type: string }
    JobReport:
      type: object
      required: [generatedAt, job, mappings, errors, specs]
      properties:
        generatedAt: { type: string, format: date-time }
        job:
          type: object
          required: [id, status, projectId, projectName, source, target, keyspaces, startedBy, durationSeconds, options]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/JobStatus' }
            projectId: { type: string }
            projectName: { type: string }
            source: { $ref: '#/components/schemas/ReportEndpoint' }
            target: { $ref: '#/components/schemas/ReportEndpoint' }
            keyspaces: { type: array, items: { type: string } }
            startedBy: { type: string }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
            durationSeconds: { type: number }
            options: {}
        mappings:
          type: array
          items:
            type: object
            required: [mappingId, table, target, keyTemplate, rowsRead, written, skipped, failed]
            properties:
              mappingId: { type: string }
              table: { type: string }
              target: { type: string }
              keyTemplate: { type: string }
              rowsRead: { type: integer, format: int64 }
              written: { type: integer, format: int64 }
              skipped: { type: integer, format: int64 }
              failed: { type: integer, format: int64 }
              verification: { $ref: '#/components/schemas/VerificationResult' }
        errors:
          type: object
          required: [total, byCode, exportUrl]
          properties:
            total: { type: integer, format: int64 }
            byCode:
              type: array
              items:
                type: object
                required: [stage, code, count]
                properties:
                  stage: { type: string }
                  code: { type: string }
                  count: { type: integer, format: int64 }
            exportUrl: { type: string }
        specs: { type: object, additionalProperties: {} }
    AuditEvent:
      type: object
      required: [id, workspaceId, userId, action, entityType, entityId, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        userId: { type: string }
        action: { type: string, example: job.create }
        entityType: { type: string, example: job }
        entityId: { type: string }
        metadata: { type: object, additionalProperties: true, description: Non-secret details (IP, project, mode…) }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: string }
    JobList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
        nextCursor: { type: string }
    CreateJobResult:
      type: object
      required: [job, preflight]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        preflight: { $ref: '#/components/schemas/PreflightResult' }
    JobEvent:
      type: object
      required: [at, kind, message]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string }
        data: {}
    JobError:
      type: object
      required: [jobId, seq, mappingId, stage, code, message, at]
      properties:
        jobId: { type: string }
        seq: { type: integer, format: int64 }
        mappingId: { type: string }
        stage: { type: string, enum: [read, transform, write] }
        code: { $ref: '#/components/schemas/RowErrorCode' }
        message: { type: string }
        fieldPath: { type: string }
        sourceKey: {}
        sample: {}
        at: { type: string, format: date-time }
    JobErrorList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobError' } }
        nextCursor: { type: string }
    JobErrorCount:
